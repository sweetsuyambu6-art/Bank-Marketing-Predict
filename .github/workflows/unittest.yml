
name: CI/CD - Build and Test Banking Marketing App

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r project_6/requirements.txt
          pip install flake8

      - name: Lint and check syntax with flake8
        run: |
          flake8 project_6 --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 project_6 --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

  docker-build:
    needs: lint-and-validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/banking-marketing-app:${{ github.sha }}
            ${{ secrets.DOCKER_USERNAME }}/banking-marketing-app:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
